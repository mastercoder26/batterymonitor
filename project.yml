name: BatteryMonitor
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.akhilkonduru.BatteryMonitor
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Battery Monitor
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    CODE_SIGNING_ALLOWED: NO
targets:
  BatteryMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources/BatteryMonitor
    settings:
      base:
        PRODUCT_NAME: Battery Monitor
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
